services:
  mariadb:
    build: ./requirements/mariadb
    image: mariadb:inception
    container_name: mariadb
    restart: always
    secrets:
      - db_password
      - db_root_password
      - db_credentials
    volumes:
      - mariadb:/var/lib/mysql
    networks:
      - inception

  wordpress:
    build: ./requirements/wordpress
    image: wordpress:inception
    container_name: wordpress
    restart: always
    secrets:
      - db_password
      - db_credentials
      - credentials
    env_file:
      - .env
    volumes:
      - wordpress:/var/www/html
    networks:
      - inception

  nginx:
    image: nginx:inception
    build: ./requirements/nginx
    container_name: nginx
    restart: always
    depends_on:
      - wordpress
    volumes:
      - wordpress:/var/www/html
    ports:
      - "443:443"
    networks:
      - inception

secrets:
  db_password:
    file: ../secrets/db_password.txt
  db_root_password:
    file: ../secrets/db_root_password.txt
  db_credentials:
    file: ../secrets/db_credentials.txt
  credentials:
    file: ../secrets/credentials.txt


networks:
  inception:
    name: inception

volumes:
  mariadb:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/gkankia/data/mariadb

  wordpress:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/gkankia/data/wordpress
